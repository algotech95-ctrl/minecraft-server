name: Minecraft Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minecraft:
    name: Minecraft 26.2 Server
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Check Java
        run: |
          java -version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Create server directories
        run: |
          mkdir -p minecraft/plugins

      - name: Download latest stable Paper 26.2
        working-directory: minecraft
        env:
          USER_AGENT: "minecraft-github-actions/1.0 (https://github.com/${{ github.repository }})"
        run: |
          set -e

          BUILDS_RESPONSE=$(curl -fsSL \
            -H "User-Agent: ${USER_AGENT}" \
            "https://fill.papermc.io/v3/projects/paper/versions/26.2/builds")

          PAPER_URL=$(echo "${BUILDS_RESPONSE}" | jq -r \
            'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // "null"')

          if [ "${PAPER_URL}" = "null" ] || [ -z "${PAPER_URL}" ]; then
            echo "ERROR: No stable Paper 26.2 build was found."
            echo "${BUILDS_RESPONSE}"
            exit 1
          fi

          echo "Paper download URL:"
          echo "${PAPER_URL}"

          curl -fL \
            -H "User-Agent: ${USER_AGENT}" \
            "${PAPER_URL}" \
            -o paper.jar

          test -s paper.jar

          echo "Paper downloaded successfully."

      - name: Accept Minecraft EULA
        working-directory: minecraft
        run: |
          echo "eula=true" > eula.txt

      - name: Create server.properties
        working-directory: minecraft
        run: |
          cat > server.properties << 'EOF'
          server-port=25565
          server-ip=
          online-mode=true
          motd=My Minecraft Server
          max-players=10
          view-distance=8
          simulation-distance=6
          difficulty=normal
          gamemode=survival
          spawn-protection=0
          enable-command-block=false
          EOF

      - name: Download latest Geyser
        working-directory: minecraft/plugins
        run: |
          set -e

          curl -fL \
            "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot" \
            -o Geyser-Spigot.jar

          test -s Geyser-Spigot.jar

          echo "Geyser downloaded successfully."

      - name: Download latest Floodgate
        working-directory: minecraft/plugins
        run: |
          set -e

          curl -fL \
            "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot" \
            -o floodgate-spigot.jar

          test -s floodgate-spigot.jar

          echo "Floodgate downloaded successfully."

      - name: Show installed files
        run: |
          echo "===== Server ====="
          ls -lh minecraft/paper.jar

          echo "===== Plugins ====="
          ls -lh minecraft/plugins/

      - name: Start Minecraft
        working-directory: minecraft
        run: |
          java \
            -Xms4G \
            -Xmx6G \
            -XX:+UseG1GC \
            -jar paper.jar \
            --nogui
